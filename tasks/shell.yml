---
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ home_dir }}/.oh-my-zsh"
    depth: 1
    update: false
  # Public repo: ignore any url.*.insteadOf rewrites in ~/.gitconfig
  # (e.g. https -> git@github.com:) so cloning never needs an SSH key.
  environment:
    GIT_CONFIG_GLOBAL: /dev/null

- name: Install Oh My Zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ home_dir }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
    update: false
  environment:
    GIT_CONFIG_GLOBAL: /dev/null
  loop: "{{ omz_custom_plugins }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write ~/.zshrc (any previous version is backed up next to it)
  ansible.builtin.template:
    src: templates/zshrc.j2
    dest: "{{ home_dir }}/.zshrc"
    mode: "0644"
    backup: true

- name: Create ~/.zshrc.local for your own additions (never overwritten)
  ansible.builtin.copy:
    dest: "{{ home_dir }}/.zshrc.local"
    content: "# Personal shell config. Not managed by Ansible.\n"
    mode: "0644"
    force: false

- name: Point Docker at Homebrew's compose/buildx plugins (kept if it exists)
  ansible.builtin.copy:
    dest: "{{ home_dir }}/.docker/config.json"
    content: |
      {
        "cliPluginsExtraDirs": ["{{ brew_prefix }}/lib/docker/cli-plugins"]
      }
    mode: "0644"
    force: false
