---
- name: Set git name and email
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: user.name, value: "{{ git_user_name }}" }
    - { name: user.email, value: "{{ git_user_email }}" }
  when: item.value | length > 0
  loop_control:
    label: "{{ item.name }}"

- name: Set sensible git defaults
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: init.defaultBranch, value: main }
    - { name: push.autoSetupRemote, value: "true" }
    - { name: fetch.prune, value: "true" }
    - { name: rerere.enabled, value: "true" }
    - { name: core.excludesfile, value: "{{ home_dir }}/.gitignore_global" }
  loop_control:
    label: "{{ item.name }}"

- name: Create global gitignore (kept if it already exists)
  ansible.builtin.copy:
    src: files/gitignore_global
    dest: "{{ home_dir }}/.gitignore_global"
    mode: "0644"
    force: false

- name: Create ~/.ssh
  ansible.builtin.file:
    path: "{{ home_dir }}/.ssh"
    state: directory
    mode: "0700"

- name: Generate an SSH key (ed25519)
  ansible.builtin.command: >-
    ssh-keygen -t ed25519 -N "" -f {{ home_dir }}/.ssh/id_ed25519
    -C "{{ git_user_email if git_user_email | length > 0 else ansible_facts['user_id'] ~ '@' ~ ansible_facts['hostname'] }}"
  args:
    creates: "{{ home_dir }}/.ssh/id_ed25519"
  when: generate_ssh_key | bool

- name: Use the macOS keychain for SSH keys
  ansible.builtin.blockinfile:
    path: "{{ home_dir }}/.ssh/config"
    create: true
    mode: "0600"
    insertbefore: BOF
    marker: "# {mark} mac-dev-setup"
    block: |
      Host *
        AddKeysToAgent yes
        UseKeychain yes
        IdentityFile ~/.ssh/id_ed25519
